<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Scripture Theory">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0f08"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldgrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#c89557"/>
    </linearGradient>
  </defs>

  <!-- Roundel — warm ink with a soft golden halo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#halo)"/>

  <!-- Compass medallion -->
  <g transform="translate(256 256)">
    <!-- Outer + inner ring -->
    <circle r="184" fill="none" stroke="#c89557" stroke-width="3.5"/>
    <circle r="168" fill="none" stroke="#6b4e2a" stroke-width="2"/>

    <!-- 24 ticks: major (cardinal) every 6, minor in between -->
    <g stroke-linecap="round">
      <!-- Major ticks (cardinal: N/E/S/W) -->
      <line x1="0" y1="-168" x2="0" y2="-144" stroke="#d4a574" stroke-width="4"/>
      <line x1="168" y1="0" x2="144" y2="0" stroke="#d4a574" stroke-width="4"/>
      <line x1="0" y1="168" x2="0" y2="144" stroke="#d4a574" stroke-width="4"/>
      <line x1="-168" y1="0" x2="-144" y2="0" stroke="#d4a574" stroke-width="4"/>

      <!-- Minor ticks -->
      <line x1="43.5" y1="-162.3" x2="38.7" y2="-144.2" stroke="#6b4e2a" stroke-width="2"/>
      <line x1="84" y1="-145.5" x2="74.6" y2="-129.3" stroke="#6b4e2a" stroke-width="2"/>
      <line x1="118.8" y1="-118.8" x2="105.6" y2="-105.6" stroke="#6b4e2a" stroke-width="2"/>
      <line x1="145.5" y1="-84" x2="129.3" y2="-74.6" stroke="#6b4e2a" stroke-width="2"/>
      <line x1="162.3" y1="-43.5" x2="144.2" y2="-38.7" stroke="#6b4e2a" stroke-width="2"/>

      <line x1="162.3" y1="43.5" x2="144.2" y2="38.7" stroke="#6b4e2a" stroke-width="2"/>
      <line x1="145.5" y1="84" x2="129.3" y2="74.6" stroke="#6b4e2a" stroke-width="2"/>
      <line x1="118.8" y1="118.8" x2="105.6" y2="105.6" stroke="#6b4e2a" stroke-width="2"/>
      <line x1="84" y1="145.5" x2="74.6" y2="129.3" stroke="#6b4e2a" stroke-width="2"/>
      <line x1="43.5" y1="162.3" x2="38.7" y2="144.2" stroke="#6b4e2a" stroke-width="2"/>

      <line x1="-43.5" y1="162.3" x2="-38.7" y2="144.2" stroke="#6b4e2a" stroke-width="2"/>
      <line x1="-84" y1="145.5" x2="-74.6" y2="129.3" stroke="#6b4e2a" stroke-width="2"/>
      <line x1="-118.8" y1="118.8" x2="-105.6" y2="105.6" stroke="#6b4e2a" stroke-width="2"/>
      <line x1="-145.5" y1="84" x2="-129.3" y2="74.6" stroke="#6b4e2a" stroke-width="2"/>
      <line x1="-162.3" y1="43.5" x2="-144.2" y2="38.7" stroke="#6b4e2a" stroke-width="2"/>

      <line x1="-162.3" y1="-43.5" x2="-144.2" y2="-38.7" stroke="#6b4e2a" stroke-width="2"/>
      <line x1="-145.5" y1="-84" x2="-129.3" y2="-74.6" stroke="#6b4e2a" stroke-width="2"/>
      <line x1="-118.8" y1="-118.8" x2="-105.6" y2="-105.6" stroke="#6b4e2a" stroke-width="2"/>
      <line x1="-84" y1="-145.5" x2="-74.6" y2="-129.3" stroke="#6b4e2a" stroke-width="2"/>
      <line x1="-43.5" y1="-162.3" x2="-38.7" y2="-144.2" stroke="#6b4e2a" stroke-width="2"/>
    </g>

    <!-- ST monogram at the center: vellum S, gold T -->
    <text
      y="50"
      text-anchor="middle"
      font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif"
      font-size="190"
      font-weight="500"
      fill="#f3e7c8"
    >S<tspan dx="-12" fill="url(#goldgrad)">T</tspan></text>
  </g>
</svg>
